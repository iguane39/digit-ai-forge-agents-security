# Fixture VERTE (D-197 (c)) : filtre d'auteur par égalité, sur le champ de l'auteur du commentaire,
# combiné par && à une autre condition. Doit rester verte.
name: revue-sur-demande
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  revue:
    if: github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@revue')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude -p "Relis le dernier commit et résume-le" --allowedTools "Read,Bash(git show:*)"
