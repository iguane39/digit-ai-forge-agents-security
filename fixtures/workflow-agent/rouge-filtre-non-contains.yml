# Fixture ROUGE WA-1 (D-197 (c)) : la liste des membres est la bonne, mais niée. « !contains(…) » réserve
# l'agent à tous ceux qui ne sont NI propriétaire, NI membre, NI collaborateur.
name: revue-sur-demande
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  revue:
    if: "!contains(fromJSON('[\"OWNER\",\"MEMBER\",\"COLLABORATOR\"]'), github.event.comment.author_association)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude -p "Relis le dernier commit et résume-le" --allowedTools "Read,Bash(git show:*)"
